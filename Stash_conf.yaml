# ==========================================================
# Stash 配置文件
# ==========================================================


# ------------------ 基础设置 ------------------
# IPv6 不写死：按官方说明 Stash 会依据系统返回的 IPv4/IPv6 状态自动选择策略。
tcp-concurrent: true


# ------------------ 代理提供者 ------------------
proxy-providers:
  All:
    type: http
    url: "你的真实订阅链接"
    interval: 86400
    path: ./all.yaml
    filter: '^(?!.*(流量|时间|重置|到期|过期|官网|网址|地址|客服|订阅|通知|群组|有效|本站|防止)).*$'


# ------------------ DNS ------------------
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # default-nameserver 只负责 bootstrap：解析下面加密 DNS 服务器的域名。
  # 官方要求除 system 外此处必须使用 IP，所以这一条仍是明文查询，无法避免。
  default-nameserver:
    - 223.5.5.5
  # 解析代理服务器域名走独立链路，不跟随代理规则；只留 1 个以降低并发查询。
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  # 官方建议移动设备配置 1~2 个 DNS 服务器，这里取上限 2 个，兼顾容错与功耗。
  # 注意 DoH 地址的主机名必须用域名，IP 形式会因 TLS 证书不匹配而校验失败。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - '*.lan'
    - 'localhost'
    - '+.local'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    - '+.ntp.org'
    - 'time.apple.com'
    - 'time.asia.apple.com'
    - 'time.windows.com'
    - 'time.android.com'
    - 'time.nist.gov'
    - 'ntp.aliyun.com'
    - 'ntp.tencent.com'
    - 'ntp.ntsc.ac.cn'
    - '*.n.n.srv.nintendo.net'
    - 'lens.l.google.com'


